wake_word_enabled: true
wake_engine: openwakeword
wake_oww_model: hey_veda
wake_oww_model_path: data/models/openwakeword/hey_veda.onnx
wake_threshold: 0.65        # 0.4 fired on its own playback/silence (scores 0.7-0.84 with rms 0.00001)
wake_window_sec: 10.0        # time to start one command; say "Hey Veda" again for the next
daemon_trigger: auto
hotkey: <f8>

# Speech-to-text. The DEFAULT is the fast English path: stt_language "en" uses the English-only model below, exactly
# as before the multilingual feature (Whisper small is ~2.5x slower, and "auto" adds language detection on top).
# To speak Hindi switch at runtime: `/language auto` (detect English or Hindi per utterance) or `/language hi`;
# `/language en` returns to the fast path. The multilingual model (stt_model_path) is loaded only on the first such
# switch. A single pin (e.g. "hi") forces every utterance to that language and breaks the others.
# Only English and Hindi are supported: auto-detection picks among stt_languages, never among Whisper's ~99.
stt_model: small
stt_model_path: data/models/whisper-small
stt_english_model_path: data/models/whisper-base.en
stt_backend: faster_whisper
stt_language: en
stt_languages: [en, hi]
# Whisper's average log-probability of what it heard: about -0.4 for clear speech, -0.8 to -1.2 when it is guessing.
# Below stt_unclear_below Veda says "I didn't catch that" (no 40+ s tool decision on a guess); below stt_shaky_below it
# answers but does not inherit the previous tool. If clear speech is being refused, lower both (more negative).
stt_unclear_below: -1.0
stt_shaky_below: -0.7
# 0 = always detect (among stt_languages). With only two candidates detection is reliable even on short clips, while the
# old "reuse the last language for short clips" rule forced English audio to be decoded in the wrong language (24 s of garbage).
stt_auto_min_sec: 0
stt_threads: null
stt_timeout: 120.0
noise_suppression_enabled: true
noise_suppression_strength: 0.75  # 0 = off, 1 = strongest; targets steady fan/hum noise

# Piper on every machine (laptop and Pi): the same voices, so what is tested here is what runs on the Pi. "auto" would
# pick Windows speech (pyttsx3) on a Windows laptop, which has English voices only and says nothing for Hindi.
tts_engine: piper
tts_voice: zira                       # pyttsx3 fallback hint only
tts_model_path: data/models/piper/en_US-lessac-medium.onnx
tts_voice_map:
  en: data/models/piper/en_US-lessac-medium.onnx
  hi: data/models/piper/hi_IN-priyamvada-medium.onnx

mic_device_index: 1         # set explicitly after running sounddevice.query_devices()
speaker_device_index: null

voice_enabled: true
speak_replies: true
min_transcript_chars: 2

speak_timeout_sec: 45.0     # slightly shorter timeout
post_speak_settle_sec: 0.3  # reduce pause before re‑arming
echo_guard: true

vad:
  engine: energy
  frame_duration_ms: 20     # smaller blocks → less overflow
  min_rms: 300.0
  speech_ratio: 3.0
  noise_adapt: 0.05
  aggressiveness: 2
  start_frames: 3
  silence_ms: 400           # end-of-speech wait: every utterance pays it. Hindi speakers who pause between phrases may need 700
  max_utterance_sec: 10.0   # shorter utterance cap
  pre_roll_frames: 5
