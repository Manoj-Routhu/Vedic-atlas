# VEDA_DEVICE=pi: Raspberry Pi 5, 8 GB. Keeps the vision model from starving the voice loop and the main model.
# Starting points only: measure on the Pi (docs/15-vision-mobile-design.md section 8, milestone M1/M7).
vision:
  binary_path: data/tools/llama-b11716-ubuntu-arm64/llama-server
  n_threads: 2              # the main model gets the other cores
  image_max_edge_px: 768
  image_max_tokens: 384
  use_mmap: false           # model held once, not twice: 3.3 GB -> 2.5 GB after an image (measured 2026-10-27)
  n_ctx: 2048               # a photo question is ~440 tokens (384 image + prompt + answer); 4096 only reserved RAM. 2.48 -> 2.25 GB
  min_headroom_mb: 2200     # ~ its measured peak (2.25 GB); with Veda running ~2.39 GB is free, and 2 GB swap covers the rest (2026-10-27)
devices:
  lan_enabled: true         # `veda` and `veda --restart` listen for paired phones on the home network (tokens still gate every route)
inference:
  # Without mmap the model is held once instead of twice (5.5 GB -> 3.4 GB RSS, same speed; measured 2026-10-27).
  use_mmap: false
  # That freed RAM pays for the prompt cache. At 128 MB the ~370 MB control prompt never fit, so every tool decision
  # re-read ~2100 tokens at ~19 tok/s (133 s); cached, the repeat took 2.9 s. 768 holds control + chat + content.
  # n_threads stays unset: generation is memory-bound here, 4 threads was no faster than llama.cpp's default of 2.
  prompt_cache_mb: 768
